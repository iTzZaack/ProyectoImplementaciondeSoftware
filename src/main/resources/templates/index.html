<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia DAISA - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, rgba(13, 110, 253, 0.75), rgba(33, 37, 41, 0.85)),
                        url('https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            max-width: 420px;
            width: 100%;
            border: none;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }
        .card-header-custom::after {
            content: "";
            position: absolute;
            bottom: -15px;
            left: 0;
            right: 0;
            height: 30px;
            background: #ffffff;
            border-radius: 50% 50% 0 0;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
        }
        .btn-custom {
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            background-color: #0d6efd;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #0b5ed7;
            color: white;
        }
    </style>
</head>
<body>

<!-- ========================================== -->
<!-- CONTENEDOR PRINCIPAL DE INICIO DE SESIÓN -->
<!-- ========================================== -->
<div class="container d-flex justify-content-center">
    <div class="main-card card">

        <!-- ========================================== -->
        <!-- ENCABEZADO DE LA TARJETA (ENTRADA) -->
        <!-- ========================================== -->
        <div class="card-header-custom">
            <div class="mb-2">
                <i class="fa-solid fa-house-chimney-medical fa-3x text-white"></i>
            </div>
            <h1 class="fw-bold mb-1 fs-2">Farmacia DAISA</h1>
            <p class="text-white-50 mb-0 small">Sistema de Gestión e Inventario</p>
        </div>

        <!-- ========================================== -->
        <!-- CUERPO DEL FORMULARIO DE ACCESO (ENTRADA) -->
        <!-- ========================================== -->
        <div class="card-body px-4 pt-4 pb-4">
            <div class="text-center mb-3">
                <span class="text-muted fw-bold small text-uppercase">
                    <i class="fa-solid fa-lock me-1 text-primary"></i> Control de Acceso
                </span>
            </div>

            <!-- Alerta de error si se equivocan de clave -->
            <div id="alertaError" class="alert alert-danger d-none py-2 small text-center" role="alert">
                <i class="fa-solid fa-circle-exclamation me-1"></i> Usuario o contraseña incorrectos.
            </div>

            <form id="loginForm" onsubmit="validarAcceso(event)">
                <div class="mb-3">
                    <label for="usuario" class="form-label small fw-bold">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" class="form-control" id="usuario" placeholder="Ingrese su usuario" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-bold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-custom shadow-sm">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar al Sistema
                    </button>
                </div>
            </form>
        </div>

        <!-- ========================================== -->
        <!-- PIE DE PÁGINA (SALIDA) -->
        <!-- ========================================== -->
        <div class="card-footer bg-white text-center py-3 border-0">
            <small class="text-muted">&copy; 2026 Farmacia DAISA</small>
        </div>
    </div>
</div>

<script>
    function validarAcceso(event) {
        event.preventDefault();
        const user = document.getElementById('usuario').value.trim();
        const pass = document.getElementById('password').value.trim();
        const alerta = document.getElementById('alertaError');

        // Credenciales del Administrador
        if (user === 'admin' && pass === 'admin123') {
            window.location.href = '/admin';
        }
        // Credenciales del Farmacéutico
        else if (user === 'farmacia' && pass === 'farma123') {
            window.location.href = '/farmaceutico';
        }
        // Si no coincide con ninguno, muestra error y bloquea el acceso
        else {
            alerta.classList.remove('d-none');
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
